<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>War Thunder Category</title>
    <link rel="stylesheet" href="/style/login.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="WTC">WAR THUNDER CATEGORY</h1>

      <div class="top-bar">
        <div class="toggle-container">
          <span>TOGGLE DARK MODE</span>
          <button class="toggle-switch"></button>
        </div>
        <div class="language-container">
          <span>LANGUAGE</span>
          <select>
            <option>KOREAN</option>
            <option>ENGLISH</option>
          </select>
        </div>
      </div>

      <hr id="line"/>

      <h2>SIGN UP</h2>
      <form>
        <input type="email" placeholder="EMAIL:" />
        <input type="password" placeholder="PASSWORD:" />
      </form>

      <a class="social-login">
        <a href="Home.html" class="google-login">
          SIGN UP WITH GOOGLE
        </a>
        <a href="Home.html">
          <img src="https://cdn-icons-png.flaticon.com/24/2991/2991148.png" alt="Google">
        </a>
      </a>
      </div>

      <p class="signin-link">SIGN IN</p>
    </div>
  </body>
</html>
