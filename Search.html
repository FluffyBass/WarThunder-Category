<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>워썬더 장비 검색</title>
    <link rel="stylesheet" href="/style/Search.CSS" />
  </head>
  <body>
    <h2>워썬더 장비 검색</h2>

    <!-- BR 선택 -->
    <select id="brFilter">
      <option value="">BR 전체</option>
      <option value="1-3">1 ~ 3</option>
      <option value="4-6">4 ~ 6</option>
      <option value="7-9">7 ~ 9</option>
      <option value="10-12">10 ~ 12</option>
    </select>

    <!-- 랭크 선택 -->
    <select id="rankFilter">
      <option value="">랭크 전체</option>
      <option value="1">랭크 1</option>
      <option value="2">랭크 2</option>
      <option value="3">랭크 3</option>
      <option value="4">랭크 4</option>
      <option value="5">랭크 5</option>
      <option value="6">랭크 6</option>
      <option value="7">랭크 7</option>
      <option value="8">랭크 8</option>
    </select>

    <!-- 국가 선택 -->
    <select id="nationFilter">
      <option value="">국가 전체</option>
      <option value="미국">미국</option>
      <option value="독일">독일</option>
      <option value="소련">소련</option>
      <option value="영국">영국</option>
      <option value="일본">일본</option>
      <option value="중국">중국</option>
      <option value="이탈리아">이탈리아</option>
      <option value="프랑스">프랑스</option>
      <option value="스웨덴">스웨덴</option>
      <option value="이스라엘">이스라엘</option>
    </select>

    <!-- 데이터 테이블 -->
    <table id="dataTable">
      <thead>
        <tr>
          <th>장비명</th>
          <th>BR</th>
          <th>랭크</th>
          <th>국가</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script src="/script/Search.js"></script>
  </body>
</html>
