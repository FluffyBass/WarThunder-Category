<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #111;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(to right, black, red, white);
        padding: 15px 30px;
        border-bottom: 4px solid #000;
      }

      .banner h1 {
        font-size: 32px;
        font-weight: bold;
        margin: 0;
        text-align: center;
        flex: 1;
      }

      .nav {
        background: none;
        border: none;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }

      .tank-list {
        display: flex;
        justify-content: space-around;
        margin: 40px 20px;
      }

      .tank-card {
        background-color: #fff;
        color: #000;
        border-radius: 12px;
        width: 280px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      }

      .tank-card img {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      .tank-card h2 {
        margin: 10px 0;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <button class="nav left">← JAPAN EMPIRE</button>
      <h1>THE THIRD REICH</h1>
      <button class="nav right">KINGDOM OF ITALY →</button>
    </div>

    <div class="tank-list">
      <div class="tank-card">
        <img src="tank1.jpg" alt="Pz.35 (t)" />
        <h2>Pz.35 (t)</h2>
        <p>승무원: 5인</p>
        <p>랭크: 1(예비)</p>
        <p>BR: 1.0</p>
        <p>평점: 5.5 / 10.0</p>
      </div>

      <div class="tank-card">
        <img src="tank2.jpg" alt="Pz. IV C" />
        <h2>Pz. IV C</h2>
        <p>승무원: 5인</p>
        <p>랭크: 1</p>
        <p>BR: 1.3</p>
        <p>평점: 6.5 / 10.0</p>
      </div>

      <div class="tank-card">
        <img src="tank3.jpg" alt="Pz. III B" />
        <h2>Pz. III B</h2>
        <p>승무원: 5인</p>
        <p>랭크: 1.3</p>
        <p>BR: 1.0</p>
        <p>평점: 6.0 / 10.0</p>
      </div>
    </div>
  </body>
</html>
